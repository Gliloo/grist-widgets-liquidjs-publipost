
<html>
<head>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/liquidjs/dist/liquid.browser.min.js"></script>
    <style>
        html, body {
            padding: 0;
            margin: 0;
            height: 100%;
        }
        body:hover #print {
            visibility: visible;
        }
        #container {
            width: 100%;
            height: 100%;
            border: none;
        }
        #print {
            visibility: hidden;
            position: fixed;
            top: 8px;
            right: 12px;
            z-index: 999;
            background: #00308F;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }
        #print:hover {
            background: #002070;
        }
        @media print {
            #print {
                display: none !important;
            }
        }
        #settings {
            padding: 0;
        }
    </style>
</head>
<body>
    <button id="print" onclick="print()">🖨️ Imprimer</button>
    <div id="settings"></div>
    <iframe id="container"></iframe>
    <script src="./script.js"></script>
</body>
</html>
